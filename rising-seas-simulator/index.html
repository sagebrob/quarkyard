* { box-sizing: border-box }

// MODEL
// CO2 -> temperature: each doubling of CO2 eventually warms Earth about 3 °C (IPCC best estimate).
// Temperature -> sea level (long-term "commitment", Levermann et al. 2013, PNAS): about 2.3 m per °C,
//   split here as ~0.4 m/°C from warm water expanding + ~690,000 km³ of meltwater per °C (≈1.9 m) from land ice.
// Meltwater -> sea level: volume ÷ ocean area (361,900,000 km²) × 1,000 = metres (same method as the paper worksheet).
// =====================================================================
const OCEAN_AREA = 361900000, MELT_PER_C = 690000, EXPAND_PER_C = 0.4, LAND_ICE_TOTAL = 23800000;
const SCEN = [420, 560, 840];
const dT = ppm => Math.max(0, Math.round(3 * Math.log2(ppm / 280) * 10) / 10);
const melt = ppm => Math.round(MELT_PER_C * dT(ppm) / 1000) * 1000;
const iceRise = ppm => melt(ppm) / OCEAN_AREA * 1000;
const expand = ppm => Math.round(EXPAND_PER_C * dT(ppm) * 100) / 100;
const totalSL = ppm => iceRise(ppm) + expand(ppm);

// Maps: '.' ocean, 'w' river/bay water, digits/letters = land height in metres (base 36), 'H' = high ground (20 m+).
// Each map's land squares × square size = the land area in the facts box.

    "566655456665", "455444445554", "34w4333w4434", "232w2212w232", "121w1w11w121", "w11w01w1w01w", "0.1w0w..w..0", "............"] },
  { id: 'saintlouis', cell: 1, pop: 254000, area: 64, scen: 560, map: [
    "...w3445678", "...w2345679", ".12w1344578", ".2ww2234568", ".1w12234567", ".2w1w233456", ".1ww2134457", ".2ww22344A8"] },
  { id: 'miami', cell: 1, pop: 442000, area: 93, areaMi2: 36.0, scen: 560, map: [
    "9887654321w...", "9987654321w...", "9A87654322w...", "AB98765432ww..", "9A87765432w1..", "9987654321ww..", "9887654321w...", "99876543221w..", "99876543221w.."] },
  { id: 'freetown', cell: 1, pop: 1056000, area: 82, scen: 840, map: [
    "..112w2.......", "..1236w64321..", ".1359BCB976431", "38BHHHHHHHHB96", "CHHHHHHHHHHHHC", "HHHHHHHHHHHHHH", "HHHHHHHHHHHHHH"] },
];
const elev = c => (c === '.' || c === 'w') ? null : (c === 'H' ? 20 : parseInt(c, 36));
const density = p => p.pop / p.area;
function floodCount(p, level) { let n = 0; for (const r of p.map) for (const c of r) { const e = elev(c); if (e !== null && e < level) n++; } return n; }
function landCount(p) { let n = 0; for (const r of p.map) for (const c of r) if (elev(c) !== null) n++; return n; }
const movers = (p, level) => floodCount(p, level) * p.cell * density(p);
const MI2_TO_KM2 = 2.59;

function candidates(str) {

  if (!s || !/^-?[\d.,]+$/.test(s)) return [];
  const out = new Set();
  const plain = v => { const n = Number(v); if (isFinite(n)) out.add(n); };
  plain(s.replace(/,/g, ''));                     // 1,234.5 (comma = thousands)
  plain(s.replace(/\./g, '').replace(',', '.'));  // 1.234,5 (dot = thousands, comma = decimal)
  if (/^-?\d+,\d+$/.test(s)) plain(s.replace(',', '.')); // 3,4 → 3.4
  return [...out];
}

  return `<section class="card" style="max-width:820px"><h2>${t('finH')}</h2><p>${t('finName')}</p>
    <label for="name" style="font-weight:700;display:block">${t('nameLab')}</label>
    <div class="row" style="margin:6px 0 12px"><input type="text" id="name" style="width:26ch;font-family:var(--f-body)" value="${esc(S.name)}" autocomplete="name"><button class="btn" id="nameBtn">${t('getCode')}</button></div>
    <div id="nameFb"></div>
    ${has ? `<p>${t('finP', esc(S.name))}</p><div class="code" id="code">${codeFor(S.name)}</div><h3 style="margin-top:16px">${t('finSum')}</h3>${pre}<div class="row"><button class="btn ghost" id="copySum">${t('copySum')}</button></div>` : ''}
    <div class="row" style="margin-top:12px"><button class="btn ghost" id="resetBtn">${t('resetAll')}</button></div></section>`;
}

// =====================================================================
// MAIN RENDER
// =====================================================================
function canEnter(i) { for (let k = 0; k < i; k++) if (!stageComplete(STAGES[k])) return false; return true; }
function renderSteps() {
  $('steps').innerHTML = STAGES.map((id, i) => `<li><button data-go="${i}" ${i === S.stage ? 'aria-current="step"' : ''} ${canEnter(i) ? '' : 'disabled'}>${stageComplete(id) ? '<span class="tick">✓</span>' : ''}${stageName(id)}</button></li>`).join('');
}
function render() {
  if (!canEnter(S.stage)) S.stage = 0;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(el => { const v = STR[lang][el.dataset.i]; if (typeof v === 'string') el.innerHTML = v; });
  $('lang-en').setAttribute('aria-pressed', lang === 'en'); $('lang-es').setAttribute('aria-pressed', lang === 'es');
  renderSteps();
  const id = STAGES[S.stage], main = $('main');
  if (id === 'start') main.innerHTML = viewStart();
  else if (id === 'units') { main.innerHTML = viewUnits(); renderQs(unitsQs(), 'qs'); }
  else if (id === 'climate') { main.innerHTML = viewClimate(); renderQs(climateQs(), 'qs'); updateChain(); }
  else if (id === 'compare') { main.innerHTML = viewCompare(); renderQs(compareQs(), 'qs'); }
  else if (id === 'finish') main.innerHTML = viewFinish();
  else {
    const p = PLACES.find(x => x.id === id), qs = placeQs(p);
    if (seaLevel[p.id] === undefined) seaLevel[p.id] = S.actions[p.id + '_raise'] ? totalSL(p.scen) : 0;
    main.innerHTML = viewPlace(p); renderQs(qs, 'qs'); drawMap(p);
  }
}
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go && !go.disabled) { const i = +go.dataset.go; if (canEnter(i)) { S.stage = i; S.maxStage = Math.max(S.maxStage, i); save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }
  if (e.target.id === 'beginBtn') {
    S.started = true; S.stage = 1; save(); render();
  }
  if (e.target.id === 'nameBtn') {
    const n = $('name').value.trim();
    if (n.length < 2) { $('nameFb').innerHTML = `<div class="fb bad" style="margin-bottom:8px">${t('needName')}</div>`; return; }
    S.name = n; save(); render();
  }
  const sea = e.target.closest('[data-sea]');
  if (sea) { const p = PLACES.find(x => x.id === STAGES[S.stage]); animateSea(p, +sea.dataset.sea); $('seaR').value = (+sea.dataset.sea).toFixed(1); }
  if (e.target.id === 'copySum') { const txt = summaryText(); navigator.clipboard?.writeText(txt).then(() => { e.target.textContent = t('copied'); setTimeout(() => e.target.textContent = t('copySum'), 1500); }).catch(() => {}); }
  if (e.target.id === 'resetBtn') {
    if (e.target.dataset.sure) { S = blank(); seaLevel = {}; save(); render(); }
    else { e.target.dataset.sure = '1'; e.target.textContent = t('resetSure'); }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'ppm') { S.ppm = +e.target.value; save(); updateChain(); }
  if (e.target.id === 'seaR') { const p = PLACES.find(x => x.id === STAGES[S.stage]); if (anim) cancelAnimationFrame(anim); seaLevel[p.id] = +e.target.value; drawMap(p); }
});
$('lang-en').addEventListener('click', () => { lang = 'en'; try { localStorage.setItem('risingSeasLang', 'en'); } catch (e) {} render(); });
$('lang-es').addEventListener('click', () => { lang = 'es'; try { localStorage.setItem('risingSeasLang', 'es'); } catch (e) {} render(); });
$('teacherBtn').addEventListener('click', () => { $('teacherBox').hidden = !$('teacherBox').hidden; });
$('teacherGo').addEventListener('click', () => { const n = $('teacherName').value; $('teacherOut').textContent = n.trim() ? codeFor(n) : ''; });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', render);
render();
</script>
</body>
</html>
